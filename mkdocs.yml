site_name: ChemWorld Docs
site_description: Programmable chemical worlds for controlled, replayable agent experimentation.
site_url: https://sunyrain.github.io/ChemWorld-Public/docs/
site_dir: site/docs
repo_url: https://github.com/sunyrain/ChemWorld-Public
repo_name: sunyrain/ChemWorld-Public
edit_uri: edit/main/docs/
copyright: ChemWorld · Software-model experiments, not instructions for physical laboratory work

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_description: 用于受控、可回放 Agent 实验的可编程化学世界。
          copyright: ChemWorld · 软件模型实验环境，不用于指导真实化学实验
          nav_translations:
            Documentation: 文档首页
            Design an environment: 设计实验环境
            Use the environment: 使用环境
            Optional CPU build: 可选CPU构建
            5-minute quickstart: 五分钟开始
            Connect an agent: 接入 Agent
            One experiment: 一次完整实验
            World foundations: 世界基座
            Domain guides: 领域指南
            Native models: 原生模型
            Reaction mechanisms: 反应机制
            Biochemical networks: 生化网络
            Stochastic reactions: 随机反应
            Shared laboratory: 共享实验室
            Current foundation: 当前基座
            Extension roadmap: 扩展待办
            Evidence: 证据
            Notebooks: Notebook 教程
            API reference: API 参考
            Limitations: 适用边界

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/experiment-explorer.js

nav:
  - Documentation: index.md
  - 5-minute quickstart: quickstart.md
  - Connect an agent: agents.md
  - Design an environment: environment-authoring.md
  - Use the environment: environment.md
  - Optional CPU build: native_cpu.md
  - One experiment: one-experiment.md
  - World foundations: world-foundations.md
  - Domain guides:
      - Native models: native_foundation.md
      - Reaction mechanisms: native_mechanisms.md
      - Biochemical networks: native_biochemical.md
      - Stochastic reactions: native_stochastic.md
      - Shared laboratory: native_shared_lab.md
  - Current foundation: current-foundation.md
  - Extension roadmap: extension-roadmap.md
  - Evidence: evidence.md
  - Notebooks: notebooks.md
  - API reference: reference.md
  - Limitations: limitations.md

strict: true
