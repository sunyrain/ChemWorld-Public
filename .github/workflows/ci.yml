name: CI

on:
  # Maintainer-requested only; ordinary pushes are validated locally.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development and comparison dependencies
        run: uv sync --locked --extra dev --extra physchem-ref
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts examples
      - name: Type check
        run: uv run --no-sync mypy src/chemworld
      - name: Test
        run: uv run --no-sync pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Build and test wheel and source distribution outside the checkout
        run: uv run --no-sync python scripts/smoke_test_wheel.py --python 3.11
