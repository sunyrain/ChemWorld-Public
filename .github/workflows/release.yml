name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development and comparison dependencies
        run: uv sync --locked --extra dev --extra physchem-ref
      - name: Require matching version and tag
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from importlib.metadata import version

          tag = os.environ["GITHUB_REF_NAME"]
          package_version = version("chemworld-bench")
          if tag != f"v{package_version}":
              raise SystemExit(f"tag {tag!r} does not match package version {package_version!r}")
          PY
      - name: Verify, test and build
        run: |
          uv run --no-sync pytest -q
          uv build
      - name: Create GitHub Release with source and package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
