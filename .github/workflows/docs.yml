name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: astral-sh/setup-uv@v6

      - name: Install locked documentation dependencies
        run: uv sync --locked --extra docs

      - name: Verify generated public visuals
        run: uv run --no-sync python scripts/build_readme_visuals.py --check

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Build bilingual capability explorer
        run: uv run --no-sync python scripts/build_explorer_site.py --output site/explore

      - name: Publish static files on the Pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          uv run --no-sync ghp-import --no-jekyll --branch gh-pages site
          git push origin gh-pages
          # A GITHUB_TOKEN push does not automatically start a Pages build.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
