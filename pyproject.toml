[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chemworld-bench"
dynamic = ["version"]
description = "A programmable physical-chemistry environment with native observations, persistent experiments and replay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ChemWorld Contributors" }
]
keywords = [
  "ai4science",
  "scientific-computing",
  "chemical-engineering",
  "gymnasium",
  "world-model",
  "agent-evaluation",
  "reinforcement-learning"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "gymnasium>=0.29,<1.1",
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<3.0",
  "pyyaml>=6.0,<7.0",
  "scipy>=1.10,<1.19",
  "scikit-learn>=1.4,<1.9",
  "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
dev = [
  "mpmath>=1.3,<2.0",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.3,<2.0",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "matplotlib>=3.8,<3.11",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6.0",
]
rl = [
  "stable-baselines3>=2.9,<3.0",
]
battery-ref = [
  "pybamm==25.4.2",
]
physchem-ref = [
  "cantera>=3.0,<4.0",
  "chemicals>=1.3",
  "fluids>=1.1",
  "phasepy>=0.0.56,<0.1",
  "teqp==0.23.2",
  "thermo>=0.4",
]

[tool.uv]
# The pinned battery reference requires NumPy 1.x; PhasePy requires NumPy 2.x.
# Keep these optional comparison environments separate from the product runtime.
conflicts = [[{ extra = "battery-ref" }, { extra = "physchem-ref" }]]

[project.scripts]
chemworld = "chemworld.cli:main"

[project.urls]
Homepage = "https://github.com/sunyrain/ChemWorld-Public"
Documentation = "https://sunyrain.github.io/ChemWorld-Public/"
Issues = "https://github.com/sunyrain/ChemWorld-Public/issues"

[tool.hatch.version]
path = "src/chemworld/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chemworld"]
exclude = ["**/*"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.hooks.custom]
path = "scripts/community_release_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N803", "N806", "N815"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "F401", "I001", "RUF001"]
"apps/task_lab/*.py" = ["RUF001"]
"src/chemworld/lab/session.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["chemworld"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "gymnasium.*",
  "pandas.*",
  "scipy.*",
  "sklearn.*",
  "stable_baselines3.*",
  "torch.*",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "fast: deterministic unit or focused contract test suitable for local iteration",
  "slow: integration, subprocess, notebook, wheel, or exhaustive audit test",
  "current: test of the active runtime, schema, protocol, or evidence surface",
  "history: compatibility or migration-boundary test for an older artifact version",
  "rl: reinforcement-learning adapter, checkpoint, training, or evaluation test",
  "reference: optional or in-repository physical-chemistry reference validation",
]
